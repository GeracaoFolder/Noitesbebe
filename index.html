  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {

        e.target.tagName, String(e.target.src || e.target.href || ''));

    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};


    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {};
    const pendingRelays = {};
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }

    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }
    window.__resourceBlobs = resourceBlobs;
    setStatus('Rendering...');
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

color:#2B3672}a:hover{color:#1B2140}\nsummary{cursor:pointer}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B2140; background: #F5F6FB; line-height: 1.6; font-size: 17px\" data-canvas-width=\"1440\" data-canvas-height=\"5400\">\n\n<header style=\"background: #141A36; padding: 18px 24px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between\">\n<div style=\"display: flex; align-items: center; gap: 10px; color: #F5F6FB; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px\">\n<svg aria-hidden=\"true\" width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{accent}}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z\"><\u002Fpath><\u002Fsvg>\n<span>Noites Tranquilas<\u002Fspan>\n<\u002Fdiv>\n<a href=\"#oferta\" style=\"color: #141A36; background: {{accent}}; text-decoration: none; font-weight: 700; font-size: 15px; padding: 12px 20px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Quero o método<\u002Fa>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"background: #141A36; color: #F5F6FB; padding: 72px 24px 96px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 56px; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; color: {{accent}}; font-weight: 600; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase\">Para mães e pais de bebês de 0 a 24 meses<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(38px, 5vw, 60px); line-height: 1.08\">Noites mais tranquilas para o seu bebê, e para você<\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; color: #C9CEE6; max-width: 520px\">Em 14 dias, uma rotina de sono respeitosa e adequada à idade do seu bebê. Sem deixar ele chorando sozinho, sem fórmulas mágicas.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<a href=\"#oferta\" style=\"color: #141A36; background: {{accent}}; text-decoration: none; font-weight: 700; font-size: 17px; padding: 16px 28px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Quero noites mais tranquilas<\u002Fa>\n<span style=\"font-size: 15px; color: #C9CEE6\">Garantia de 7 dias<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"aspect-ratio: 4 / 3; border-radius: 24px; border: 1.5px dashed #4A5389; background: #1E2547; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; color: #A9B0D6; font-size: 15px\">[FOTO: mãe ninando o bebê no quarto à meia-luz]<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 88px 24px\">\n<div style=\"max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.15\">Você se reconhece em alguma dessas noites?<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border-radius: 16px; padding: 18px 20px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2B3672\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>Já perdeu a conta de quantas vezes levantou esta noite.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border-radius: 16px; padding: 18px 20px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2B3672\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>O bebê só dorme no colo ou no peito, e acorda assim que vai para o berço.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border-radius: 16px; padding: 18px 20px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2B3672\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>Pesquisou de tudo, e cada dica diz uma coisa diferente.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border-radius: 16px; padding: 18px 20px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2B3672\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>Sente culpa e se pergunta se está fazendo algo errado.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #E6E9F7; border-radius: 20px; padding: 28px 28px\">\n<p style=\"margin: 0 0 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px\">Seu bebê não precisa de mais cansaço. Precisa de ritmo.<\u002Fp>\n<p style=\"margin: 0\">Quando a rotina respeita as janelas de sono de cada fase, o sono tende a ficar mais longo e previsível. Não é sobre deixar chorar, é sobre entender o que o seu bebê precisa e oferecer isso todos os dias, ction>\n\n<section style=\"padding: 88px 24px\">\n<div style=\"max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.15\">Você se reconhece em alguma dessas noites?<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border-radius: 16px; padding: 18px 20px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2B3672\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>Já perdeu a conta de quantas vezes levantou esta noite.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border-radius: 16px; padding: 18px 20px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2B3672\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>O bebê só dorme no colo ou no peito, e acorda assim que vai para o berço.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border-radius: 16px; padding: 18px 20px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2B3672\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>Pesquisou de tudo, e cada dica diz uma coisa diferente.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border-radius: 16px; padding: 18px 20px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2B3672\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>Sente culpa e se pergunta se está fazendo algo errado.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #E6E9F7; border-radius: 20px; padding: 28px 28px\">\n<p style=\"margin: 0 0 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px\">Seu bebê não precisa de mais cansaço. Precisa de ritmo.<\u002Fp>\n<p style=\"margin: 0\">Quando a rotina respeita as janelas de sono de cada fase, o sono tende a ficar mais longo e previsível. Não é sobre deixar chorar, é sobre entender o que o seu bebê precisa e oferecer isso todos os dias, do mesmo jeito.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 88px 24px; background: #FFFFFF\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 720px\">\n<p style=\"margin: 0; color: #4B57A8; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">O método<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.15\">5 módulos e um plano de 14 dias para aplicar em casa<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px\">\n<div style=\"background: #F5F6FB; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; color: #4B57A8\">01<\u002Fspan><h3 style=\"margin: 0; font-size: 19px\">Como o sono do bebê funciona<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #454B6B\">Ciclos, janelas de sono e saltos de desenvolvimento em cada fase.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F5F6FB; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; color: #4B57A8\">02<\u002Fspan><h3 style=\"margin: 0; font-size: 19px\">Ambiente e sono seguro<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #454B6B\">Luz, temperatura, ruído e um berço montado do jeito certo.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F5F6FB; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; color: #4B57A8\">03<\u002Fspan><h3 style=\"margin: 0; font-size: 19px\">Rotina e ritual do sono<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #454B6B\">Um passo a passo por idade para o bebê entender que é hora de dormir.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F5F6FB; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; color: #4B57A8\">04<\u002Fspan><h3 style=\"margin: 0; font-size: 19px\">Despertares e mamadas noturnas<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #454B6B\">Como diferenciar fome de despertar parcial e reduzir as mamadas no seu tempo.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F5F6FB; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; color: #4B57A8\">05<\u002Fspan><h3 style=\"margin: 0; font-size: 19px\">Sonecas e regressões<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #454B6B\">O que fazer nas fases difíceis e como manter px 24px\"><summary style=\"font-weight: 700; font-size: 18px\">Por quanto tempo tenho acesso?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #454B6B\">[DEFINA O PRAZO DE ACESSO, POR EXEMPLO 12 MESES]<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 88px 24px; background: #E6E9F7; text-align: center\">\n<div style=\"max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; align-items: center\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.15\">Daqui a 14 dias, como você quer que sejam as suas noites?<\u002Fh2>\n<a href=\"#oferta\" style=\"color: #141A36; background: #F2C46D; text-decoration: none; font-weight: 700; font-size: 18px; padding: 18px 32px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Quero noites mais tranquilas<\u002Fa>\n<span style=\"font-size: 15px; color: #454B6B\">Garantia de 7 dias · acesso imediato<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #141A36; color: #A9B0D6; padding: 40px 24px; font-size: 14px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0\">O conteúdo deste método é educativo e não substitui a avaliação do pediatra. Siga sempre as recomendações de sono seguro: bebê de barriga para cima, em berço firme e sem objetos soltos.<\u002Fp>\n<p style=\"margin: 0\"><a href=\"#\" style=\"color: #C9CEE6\">Política de privacidade<\u002Fa> · <a href=\"#\" style=\"color: #C9CEE6\">Termos de uso<\u002Fa> · [CNPJ / CONTATO]<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F2C46D&quot;,&quot;options&quot;:[&quot;#F2C46D&quot;,&quot;#F4A98C&quot;,&quot;#A8D5C2&quot;,&quot;#C7B
